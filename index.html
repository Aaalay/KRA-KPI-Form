<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AAALAY Weekly KRA / KPI Form</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;color:#1c2140;font:16px Inter,Arial,sans-serif;padding:16px;box-sizing:border-box}
  main{max-width:520px;text-align:center}
  a{color:#2A5FE0;font-weight:700}
</style>
</head>
<body>
<main>
  <p>The KRA / KPI form has moved to a secure link. Opening it now…</p>
  <p>If nothing happens, <a id="go" href="https://script.google.com/a/macros/aaalay.com/s/AKfycbwywd4UHY81VFDtukwbl5MfkfzCkWhnotK77DlCS7yYQE8SbM0_qnzolrwKzkK99GjQ/exec?page=form">open the secure form</a> and sign in with your @aaalay.com Google account.</p>
</main>
<script>
/* Sends people to the secure form. If this browser holds a submission that the old form could not send,
   it is passed along in the link's # part (never sent to any server), so the secure form can offer "Send it now". */
(async function () {
  var APP = 'https://script.google.com/a/macros/aaalay.com/s/AKfycbwywd4UHY81VFDtukwbl5MfkfzCkWhnotK77DlCS7yYQE8SbM0_qnzolrwKzkK99GjQ/exec?page=form';
  var target = APP;
  try {
    var pending = JSON.parse(localStorage.getItem('aaalay_pending_submission_v1') || 'null');
    if (pending && pending.rows && pending.rows.length && window.CompressionStream) {
      var bytes = new TextEncoder().encode(JSON.stringify(pending));
      var gz = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
      var bin = '';
      for (var i = 0; i < gz.length; i++) bin += String.fromCharCode(gz[i]);
      var b64 = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      if (b64.length < 60000) target = APP + '#restore=' + b64;
    }
  } catch (e) {}
  document.getElementById('go').href = target;
  location.replace(target);
})();
</script>
</body>
</html>
